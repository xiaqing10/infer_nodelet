# Set up your params
use_shm: false
batch_mode: false
# 检测置信度阈值（过滤得分低于该值的框）与检测器 NMS IoU 阈值
conf_threshold: 0.25
nms_threshold: 0.65
# 主图 + ROI 检测结果合并去重的 IoU 阈值（NVIDIA ROI 增强专用，与 nms_threshold 无关）
nms_iou_threshold: 0.3
# ROI 放大检测增强（方案A）：ROI 抠图混入同一 batch 检测远处小目标。
# 注意：ROI 完全按相机单独配置（见下方 camera_roi），不再有全局 ROI 开关/比例。
# 未在 camera_roi 中显式配置的相机，其 ROI 默认关闭。
process_delay_print_interval: 20  # 处理延时打印间隔（秒），0 表示关闭
# 批填充目标（完整帧槽位数）。不设置(-1)时自动取实际启用相机数；ROI 开时内部钳制 ≤ batch_size/2
# 6 路项目默认即可（自动=6），8 路项目若想满批可设 8
max_full: 6
# ROI 调试：保存裁剪的 ROI 图与带 ROI 框的原图（写到 write_path/roi_debug/），默认关
roi_save_debug: false
det_engine_name: /home/files/rvf/share/infer_nodelet/model/detect_dh.engine
color_engine_name: /home/files/rvf/share/infer_nodelet/model/vehicle_color_dh.engine
abandon_engine_name: /home/files/rvf/share/infer_nodelet/model/abandon_dh.engine
vechile_color_rate: 15
abandon_rate: 6
min_points_len: 30
write_flag: false
save_img_flag: false
write_path: /home/files/nfsroot/
# 本地保存发布带框图像（离线调试用，网络差无法实时看发布图像时开启），
# 按时间间隔节流：每个相机每隔 save_pub_interval 秒保存一帧到 <write_path>/pub_img/，默认关
save_pub_img: false
save_pub_interval: 5
# 本地保存原始检测结果图（跟踪前，直接画检测层框，验证 ROI 检测有效性）到 <write_path>/det_img/，默认关
save_det_img: false
byte_track_config_file: /home/files/rvf/share/infer_nodelet/config/bytetrack.yaml
traffic_analyzer:
  enabled: false
  templates_path: /data/rvf/nfsroot/templates
  events_path: /data/rvf/nfsroot/events
  stationary_frames: 30
  stationary_threshold: 0.005
  abnormal_speed_std_threshold: 3.0
model:
  - {det_class: 10, det_stride: 3, abandon_class: 3, abandon_stride: 3}
test:
  test_flag: false
  camera_type: short
  camera_direction: upstream
  publish_img_topic: /test_img
  publish_img_result: /test_ret
  publish_fps: /test_fps
  publish_img: true
  draw_tracker: true
  receive_radar_topic: /test_radar_data_tracker_Project
  video_path: ""
  receive_img_topic: /test
camera_visual:
  - {direction: upstream, focal_type: short, publish_img: true, draw_tracker: true}
  - {direction: downstream, focal_type: short, publish_img: false, draw_tracker: true}
  - {direction: downstream, focal_type: long, publish_img: false, draw_tracker: true}
  - {direction: upstream, focal_type: long, publish_img: false, draw_tracker: true}
# 按 pole_name + direction + focal_type 精确过滤指定摄像头：enable=false 则该相机不创建推理线程、不占 batch 槽位
camera_filter:
  - {pole_name: mec_0000, direction: downstream, focal_type: long, enable: false}
# per-camera ROI：按 pole_name + direction + focal_type 精确匹配，ROI 完全按相机单独配置。
# height_ratio/width_ratio = ROI 尺寸占原图比例；y_ratio/x_ratio = ROI 框左上角偏移占原图比例（0=顶部/左缘，0.5=居中）。
# 每条必须显式写 height_ratio/width_ratio/y_ratio/x_ratio；未在列表中显式配置的相机，ROI 默认关闭（不生成 ROI 槽位）。
# enabled=false 则该相机不生成 ROI 槽位。
camera_roi:
  - {pole_name: mec_0000, direction: upstream, focal_type: short, enabled: true, height_ratio: 0.5, width_ratio: 0.5, y_ratio: 0.0, x_ratio: 0.5}
debug_log: false
